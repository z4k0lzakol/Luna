# Luna na telefonie: Android (APK) i iOS (aplikacja bez podpisu – do App Store potrzebne jest konto Apple Developer).
# Przy tagu v* plik APK trafia do wydania na GitHubie (obok wersji na komputer).
name: Luna na telefonie

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml', 'luna_link.py', 'tests/link_peer.py']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Testy (połączone urządzenia – także zgodność z Luną na komputerze)
        env:
          LUNA_PYTHON: python
        run: |
          python -m pip install --quiet cryptography
          flutter test
      - name: Wersja i klucz podpisu
        working-directory: .
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # wersja z luna.py (jak na komputerze): 1.0.12 → numer kompilacji 10012 (Android przyjmuje tylko rosnące numery)
          v=$(python3 -c "import re;print(re.search(r'^VERSION = \"([^\"]+)\"', open('luna.py', encoding='utf-8').read(), re.M).group(1))")
          IFS=. read -r a b c <<< "$v"
          echo "LUNA_VERSION=$v" >> "$GITHUB_ENV"
          echo "LUNA_BUILD=$((a * 1000000 + b * 1000 + c))" >> "$GITHUB_ENV"
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/luna-release.jks"
            { echo "LUNA_KEYSTORE=$RUNNER_TEMP/luna-release.jks"; echo "LUNA_KEYSTORE_PASSWORD=$KS_PASSWORD"; echo "LUNA_KEY_ALIAS=${KS_ALIAS:-luna}"; } >> "$GITHUB_ENV"
            echo "Podpis: stały klucz wydań"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Brak sekretu ANDROID_KEYSTORE_BASE64 – wydanie bez stałego klucza nie zainstaluje się jako aktualizacja"; exit 1
          else
            echo "::warning::Brak sekretu ANDROID_KEYSTORE_BASE64 – APK podpisany kluczem testowym"
          fi
      - name: Budowanie APK
        run: |
          # do 3 prób – Maven Central bywa przeciążony (HTTP 429) i Gradle nie pobiera wtedy wtyczek
          for i in 1 2 3; do
            flutter build apk --release --build-name="$LUNA_VERSION" --build-number="$LUNA_BUILD" --dart-define=LUNA_VERSION="$LUNA_VERSION" && exit 0
            echo "Próba $i nieudana"; sleep 60
          done
          exit 1
      - name: Nazwa pliku
        run: cp build/app/outputs/flutter-apk/app-release.apk ../Luna-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Luna-Android
          path: Luna-Android.apk
      - name: Dołącz do wydania
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          # wydanie tworzy workflow wersji na komputer – czekamy, aż powstanie
          for i in $(seq 1 60); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" Luna-Android.apk --clobber && exit 0
            fi
            sleep 30
          done
          echo "Nie znaleziono wydania $GITHUB_REF_NAME" >&2
          exit 1

  ios:
    name: iOS (bez podpisu)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Paczka .ipa (bez podpisu)
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr ../Luna-iOS-bez-podpisu.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Luna-iOS-bez-podpisu
          path: Luna-iOS-bez-podpisu.ipa
