# Luna na telefonie: Android (APK) i iOS (aplikacja bez podpisu – do App Store potrzebne jest konto Apple Developer).
# Przy tagu v* plik APK trafia do wydania na GitHubie (obok wersji na komputer).
name: Luna na telefonie

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release
      - name: Nazwa pliku
        run: cp build/app/outputs/flutter-apk/app-release.apk ../Luna-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Luna-Android
          path: Luna-Android.apk
      - name: Dołącz do wydania
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          # wydanie tworzy workflow wersji na komputer – czekamy, aż powstanie
          for i in $(seq 1 60); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" Luna-Android.apk --clobber && exit 0
            fi
            sleep 30
          done
          echo "Nie znaleziono wydania $GITHUB_REF_NAME" >&2
          exit 1

  ios:
    name: iOS (bez podpisu)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Paczka .ipa (bez podpisu)
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr ../Luna-iOS-bez-podpisu.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Luna-iOS-bez-podpisu
          path: Luna-iOS-bez-podpisu.ipa
