name: Wydanie Luny

# Tag v* (np. v1.0.0) → budowanie na Windows, Linuksie i macOS, test uruchomienia i wydanie na GitHubie.
# Ręcznie (Actions → Wydanie Luny → Run workflow) – samo budowanie i test, pliki do pobrania w podsumowaniu.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Budowanie (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-22.04
            name: Linux
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Biblioteki systemowe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-xkb1 libegl1 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libfuse2 libdbus-1-3 xvfb

      - name: Biblioteki Pythona
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt

      - name: Numer wersji
        id: ver
        shell: bash
        run: |
          v=$(python -c "import re;print(re.search(r'^VERSION = \"([^\"]+)\"', open('luna.py', encoding='utf-8').read(), re.M).group(1))")
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "Wersja: $v"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$v" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME nie zgadza się z VERSION = $v w luna.py"; exit 1
          fi

      - name: Budowanie aplikacji (PyInstaller)
        run: python -m PyInstaller --noconfirm packaging/luna.spec

      - name: Test uruchomienia
        shell: bash
        env:
          LUNA_NO_WELCOME: "1"
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: |
          export HOME="$RUNNER_TEMP/luna-home" USERPROFILE="$RUNNER_TEMP/luna-home"
          mkdir -p "$HOME"
          case "$RUNNER_OS" in
            Windows) ./dist/Luna/Luna.exe --luna-smoke-test ;;
            Linux)   xvfb-run -a ./dist/Luna/Luna --luna-smoke-test ;;
            macOS)   ./dist/Luna.app/Contents/MacOS/Luna --luna-smoke-test ;;
          esac
          echo "Luna uruchomiła się i zamknęła poprawnie."

      # Podpis cyfrowy (SignPath Foundation) – działa dopiero po akceptacji projektu i dodaniu w ustawieniach repozytorium
      # sekretu SIGNPATH_API_TOKEN oraz zmiennych SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG.
      # Każde wydanie trzeba zatwierdzić do podpisu w panelu SignPath (zasady „Code signing policy”).
      - name: Luna.exe do podpisu (SignPath)
        id: unsigned-exe
        if: runner.os == 'Windows' && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: actions/upload-artifact@v4
        with:
          name: Luna-exe-do-podpisu
          path: dist/Luna/Luna.exe

      - name: Podpis Luna.exe (SignPath)
        if: runner.os == 'Windows' && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: luna-exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/podpisane-exe

      - name: Podpisany Luna.exe na miejsce
        if: runner.os == 'Windows' && vars.SIGNPATH_PROJECT_SLUG != ''
        shell: pwsh
        run: |
          Copy-Item dist/podpisane-exe/Luna.exe dist/Luna/Luna.exe -Force
          $sig = Get-AuthenticodeSignature dist/Luna/Luna.exe
          Write-Host "Podpis Luna.exe: $($sig.Status) – $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Luna.exe nie ma poprawnego podpisu" }

      - name: Instalator Windows (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.v }} /DSourceDir=..\dist\Luna packaging\luna.iss
          Compress-Archive -Path dist\Luna -DestinationPath dist\Luna-${{ steps.ver.outputs.v }}-Windows.zip

      - name: Instalator do podpisu (SignPath)
        id: unsigned-setup
        if: runner.os == 'Windows' && vars.SIGNPATH_PROJECT_SLUG != ''
        shell: pwsh
        run: Copy-Item dist\Luna-${{ steps.ver.outputs.v }}-Windows-Setup.exe dist\Luna-Setup.exe

      - name: Instalator – przesłanie do podpisu
        id: unsigned-setup-artifact
        if: runner.os == 'Windows' && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: actions/upload-artifact@v4
        with:
          name: Luna-Setup-do-podpisu
          path: dist/Luna-Setup.exe

      - name: Podpis instalatora (SignPath)
        if: runner.os == 'Windows' && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: luna-setup
          github-artifact-id: ${{ steps.unsigned-setup-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/podpisany-setup

      - name: Podpisany instalator na miejsce
        if: runner.os == 'Windows' && vars.SIGNPATH_PROJECT_SLUG != ''
        shell: pwsh
        run: |
          Copy-Item dist/podpisany-setup/Luna-Setup.exe dist\Luna-${{ steps.ver.outputs.v }}-Windows-Setup.exe -Force
          Remove-Item dist\Luna-Setup.exe
          $sig = Get-AuthenticodeSignature dist\Luna-${{ steps.ver.outputs.v }}-Windows-Setup.exe
          if ($sig.Status -ne 'Valid') { throw "Instalator nie ma poprawnego podpisu" }

      - name: Test instalatora Windows (instalacja, uruchomienie, odinstalowanie)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = "dist\Luna-${{ steps.ver.outputs.v }}-Windows-Setup.exe"
          Start-Process $setup -ArgumentList '/VERYSILENT', '/CURRENTUSER', '/NORESTART' -Wait
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Luna\Luna.exe"
          if (-not (Test-Path $exe)) { throw "Instalator nie zainstalował Luny w $exe" }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) "Luna.lnk"))) { throw "Brak skrótu w menu Start" }
          $env:LUNA_NO_WELCOME = "1"; $env:USERPROFILE = "$env:RUNNER_TEMP\luna-home2"; New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          $p = Start-Process $exe -ArgumentList '--luna-smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Zainstalowana Luna nie uruchomiła się (kod $($p.ExitCode))" }
          Start-Process (Join-Path $env:LOCALAPPDATA "Programs\Luna\unins000.exe") -ArgumentList '/VERYSILENT' -Wait
          Start-Sleep 3
          if (Test-Path $exe) { throw "Odinstalowanie nie usunęło Luny" }
          Write-Host "Instalacja, uruchomienie i odinstalowanie działają."

      - name: Test samoinstalacji z pliku .zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $T = "$env:RUNNER_TEMP\selfinstall"; New-Item -ItemType Directory -Force "$T\sc", "$T\home" | Out-Null
          $env:LUNA_INSTALL_DIR = "$T\Programs\Luna"; $env:LUNA_SHORTCUT_DIR = "$T\sc"; $env:LUNA_INSTALL_REGKEY = "Software\LunaInstallTest"
          $env:LUNA_NO_WELCOME = "1"; $env:USERPROFILE = "$T\home"
          $p = Start-Process dist\Luna\Luna.exe -ArgumentList '--luna-self-install' -PassThru -Wait
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$T\Programs\Luna\Luna.exe") -or -not (Test-Path "$T\sc\Luna.lnk")) { throw "Samoinstalacja nie zadziałała" }
          $p = Start-Process "$T\Programs\Luna\Luna.exe" -ArgumentList '--luna-smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Zainstalowana Luna nie uruchomiła się" }
          Start-Process "$T\Programs\Luna\Luna.exe" -ArgumentList '--luna-uninstall', '--quiet' -Wait
          Start-Sleep 10
          if ((Test-Path "$T\Programs\Luna") -or (Test-Path "HKCU:\Software\LunaInstallTest")) { throw "Odinstalowanie nie usunęło Luny" }
          Write-Host "Samoinstalacja z .zip, uruchomienie i odinstalowanie działają."

      - name: AppImage i archiwum (Linux)
        if: runner.os == 'Linux'
        run: |
          bash packaging/build_appimage.sh "${{ steps.ver.outputs.v }}"
          tar -czf "dist/Luna-${{ steps.ver.outputs.v }}-Linux-x86_64.tar.gz" -C dist Luna

      - name: Obraz DMG (macOS)
        if: runner.os == 'macOS'
        # okno z tłem (packaging/dmg_background.py): „przeciągnij do Aplikacji” + jak otworzyć Lunę bez podpisu Apple,
        # obok plik „Jak otworzyć Lunę.txt”; gdy create-dmg zawiedzie (AppleScript w Finderze), zwykły .dmg bez tła
        run: |
          codesign --force --deep --sign - dist/Luna.app
          DMG="dist/Luna-${{ steps.ver.outputs.v }}-macOS-arm64.dmg"
          HELP="Jak otworzyć Lunę.txt"
          mkdir -p dist/dmg && cp -R dist/Luna.app dist/dmg/ && cp "packaging/dmg/$HELP" dist/dmg/ && ln -s /Applications dist/dmg/Aplikacje
          python packaging/dmg_background.py dist/dmg-tlo
          tiffutil -cathidpicheck dist/dmg-tlo/tlo.png dist/dmg-tlo/tlo@2x.png -out dist/dmg-tlo/tlo.tiff
          brew install create-dmg || true
          for i in 1 2 3; do
            rm -f "$DMG"
            create-dmg --volname "Luna" --background dist/dmg-tlo/tlo.tiff \
              --window-pos 200 120 --window-size 660 480 --icon-size 72 --text-size 12 \
              --icon "Luna.app" 165 150 --icon "Aplikacje" 495 150 --icon "$HELP" 330 400 \
              "$DMG" dist/dmg/ && [ -f "$DMG" ] && break
            echo "create-dmg – próba $i nieudana"; sleep 5
          done
          if [ ! -f "$DMG" ]; then
            echo "::warning::create-dmg nie zadziałał – .dmg bez tła (z plikiem „$HELP”)"
            hdiutil create -volname "Luna" -srcfolder dist/dmg -ov -format UDZO "$DMG"
          fi
          hdiutil verify "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: Luna-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.dmg
          if-no-files-found: error

  release:
    name: Wydanie na GitHubie
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: pliki
          merge-multiple: true
      - name: Utwórz wydanie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # stałe nazwy plików (bez numeru wersji) – stały link do pobrania i autoaktualizacja; numer zostaje w tagu
          (cd pliki && for f in Luna-*; do n=$(echo "$f" | sed -E 's/^Luna-[0-9]+\.[0-9]+\.[0-9]+-/Luna-/'); [ "$f" = "$n" ] || mv "$f" "$n"; done)
          ls -la pliki
          (cd pliki && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" pliki/* --title "Luna" --notes-file packaging/release_notes.md --latest
          # jedno wydanie na GitHubie: starsze wydania znikają (tagi zostają w historii repozytorium)
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r t; do
            [ "$t" = "$GITHUB_REF_NAME" ] || gh release delete "$t" --yes
          done
