<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;font:13px/1.4 system-ui,'Segoe UI',sans-serif;background:#f1f3f4;color:#3c4043}
@media (prefers-color-scheme:dark){body{background:#202124;color:#e8eaed}a{color:#8ab4f8}}
a{display:block;max-width:90%;padding:12px 16px;border:1px dashed currentColor;border-radius:8px;text-align:center;color:#1a73e8;text-decoration:none;word-break:break-all}
a:hover{text-decoration:underline}
small{display:block;opacity:.7;margin-top:4px}
</style>
</head>
<body>
<a id="go" href="#">Kliknij, aby wczytać ramkę<small id="host"></small></a>
<script>
(function () {
    var p = new URLSearchParams(location.search);
    var u = p.get('url') || p.get('u') || '';
    var a = document.getElementById('go');
    var h = document.getElementById('host');
    var ok = /^https?:\/\//i.test(u);
    if (ok) {
        try { h.textContent = new URL(u).hostname; } catch (e) { ok = false; }
    }
    if (!ok) { a.removeAttribute('href'); h.textContent = ''; return; }
    a.href = u;
    a.addEventListener('click', function (e) { e.preventDefault(); location.replace(u); });
})();
</script>
</body>
</html>
